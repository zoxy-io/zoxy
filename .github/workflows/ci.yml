name: CI

on:
  push:
    branches: [main, libxev]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: test, lint & sim (${{ matrix.os }})
    # Linux is the production target (io_uring); macOS exercises the
    # kqueue backend so local-bench portability cannot silently regress —
    # its failure modes (e.g. close ops requiring a thread pool) only
    # surface at runtime, which a cross-compile check would miss.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The pinned Zig, without Nix. CI used to run every command inside a
      # devenv shell, which made Nix the first thing each job depended on
      # and the one that failed most often: binary caches down, store
      # paths that came back invalid (the coverage job carried a whole
      # /nix/store cache just to dodge `ldexpl.c is not valid`) — all
      # failing runs before a line of zoxy compiled. All to deliver one
      # compiler: libcrypto has been built by Zig since #279, so the
      # shell's openssl was already dead weight.
      #
      # setup-zig fetches the official tarball from the community mirrors
      # in random order, ziglang.org last, and checks its minisign
      # signature before use, so one mirror down costs a retry rather than
      # the run; the tarball itself is then cached. The version is
      # build.zig.zon's `minimum_zig_version` (the action's default), so
      # it travels with the tree and matches devenv's zig_0_17.
      #
      # It also caches the Zig cache — fetched packages and compiled
      # artifacts, the vendored OpenSSL above all — per job and platform,
      # restoring the newest entry and saving a fresh one each run.
      # Measured 2026-11-14 on the dev box: a cold `zig build ci` takes
      # 3m53s and leaves ~1 GB of cache, and the same run warm takes 28 s.
      # The action empties the cache once it passes 2 GiB (its default
      # limit), so a cold run is the price of every few incremental ones —
      # raise `cache-size-limit` only if that cadence turns out too tight.
      - name: Install Zig
        uses: mlugg/setup-zig@v2

      # zig-pkg (vendored, hash-pinned deps) is deliberately not checked.
      - name: Check formatting
        run: zig fmt --check build.zig src bench sim smoke scripts

      - name: Build
        run: zig build

      # The per-change gates (DESIGN.md §9): unit tests, the fd-boundary
      # lint, and the deterministic simulator (failures replay locally with
      # `zig build sim -- <seed> 1`). The Tier-1 bench is deliberately
      # excluded — its verdict is a band comparison against a real origin
      # at merge, not a blind shared-runner pass.
      - name: Run gates (test + lint + sim)
        run: zig build ci --summary all

  coverage:
    name: coverage
    # kcov is Linux-only; the merged report is the unit tests plus a
    # simulator sweep, which reaches error paths unit tests cannot.
    #
    # Pinned to 26.04 rather than ubuntu-latest because that is where kcov
    # comes from: Ubuntu's archive carries kcov 43 from 26.04 on (24.04 has
    # none at all), the same release nixpkgs gives the dev shell, so
    # build.zig's workaround for kcov 43's DWARF gotcha holds for both. A
    # moving label would make the kcov version move under it.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      # From the runner's own Ubuntu mirror rather than a third-party
      # download, with apt's retries on for a transient mirror failure.
      - name: Install kcov
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y kcov
          kcov --version

      - name: Measure coverage (kcov)
        run: zig build coverage

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: zig-out/coverage/kcov-merged/cobertura.xml
          format: cobertura
