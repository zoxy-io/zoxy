name: CI

on:
  push:
    branches: [main, libxev]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: test, lint & sim (${{ matrix.check_label }})
    # Both runners exercise io_uring, the production backend. The backends
    # job below compiles kqueue and epoll; the release workflow
    # smoke-tests kqueue on macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            check_label: ubuntu-latest
          - runner: ubuntu-24.04-arm
            # Branch protection requires the existing macOS check name.
            check_label: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # The pinned Zig, without Nix. CI used to run every command inside a
      # devenv shell, which made Nix the first thing each job depended on
      # and the one that failed most often: binary caches down, store
      # paths that came back invalid (the coverage job carried a whole
      # /nix/store cache just to dodge `ldexpl.c is not valid`) — all
      # failing runs before a line of zoxy compiled. All to deliver one
      # compiler: libcrypto has been built by Zig since #279, so the
      # shell's openssl was already dead weight.
      #
      # setup-zig fetches the official tarball from the community mirrors
      # in random order, ziglang.org last, and checks its minisign
      # signature before use, so one mirror down costs a retry rather than
      # the run; the tarball itself is then cached. The version is
      # build.zig.zon's `minimum_zig_version` (the action's default), so
      # it travels with the tree and matches devenv's zig_0_17.
      #
      # It also caches the Zig cache — fetched packages and compiled
      # artifacts, the vendored OpenSSL above all — per job and platform,
      # restoring the newest entry and saving a fresh one each run.
      # Measured 2026-11-14 on the dev box: a cold `zig build ci` takes
      # 3m53s and leaves ~1 GB of cache, and the same run warm takes 28 s.
      # The action empties the cache once it passes 2 GiB (its default
      # limit), so a cold run is the price of every few incremental ones —
      # raise `cache-size-limit` only if that cadence turns out too tight.
      - name: Install Zig
        uses: mlugg/setup-zig@v2

      # zig-pkg (vendored, hash-pinned deps) is deliberately not checked.
      - name: Check formatting
        run: zig fmt --check build.zig src bench sim smoke scripts tools examples/edge/build.zig examples/edge/build.zig.zon examples/edge/src examples/edge/smoke

      - name: Build
        run: zig build

      # The per-change gates (DESIGN.md §9): unit tests, the fd-boundary
      # lint, and the deterministic simulator (failures replay locally with
      # `zig build sim -- <seed> 1`). The Tier-1 bench is deliberately
      # excluded — its verdict is a band comparison against a real origin
      # at merge, not a blind shared-runner pass.
      - name: Run gates (test + lint + sim)
        run: zig build ci --summary all

  consumer:
    name: consumer (fetched package)
    # A dependent builds against what `zig fetch` takes from a tarball:
    # build.zig.zon's `.paths`, nothing more (#417). The example is built
    # against exactly that, so a file the library needs and the package
    # leaves out fails here rather than for a dependent. A fresh runner
    # also has no lazy dependency cached, so one the library's build asks
    # for without needing it shows up as a fetch in this log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Build, test and smoke the example against a fetched zoxy
        run: |
          work="$RUNNER_TEMP/consumer"
          mkdir -p "$work"
          git archive --format=tar.gz --prefix=zoxy/ -o "$work/zoxy.tar.gz" HEAD
          cp -R examples/edge "$work/edge"
          cd "$work/edge"
          # The committed manifest depends on the tree by path; drop that
          # entry so `--save` writes the fetched package's url and hash.
          sed -i '/\.zoxy = \.{ \.path = "\.\.\/\.\." },/d' build.zig.zon
          if grep -q '"\.\./\.\."' build.zig.zon; then
            echo "the path dependency survived the sed; update its pattern" >&2
            exit 1
          fi
          zig fetch --save=zoxy "$work/zoxy.tar.gz"
          zig build --summary all
          # Its own extensions under the simulator, through zoxy.testing:
          # the zero-allocation gate and a replayed seed.
          zig build test --summary all
          # The binary on real sockets (XevIo), drained by SIGTERM — in the
          # default build, and in the ReleaseSafe one a dependent ships,
          # whose failure modes a Debug build cannot reproduce (#283).
          zig build smoke
          zig build smoke -Doptimize=ReleaseSafe

  backends:
    name: other backends (kqueue, epoll)
    # The `ci` job builds and runs io_uring alone, so nothing on a PR used
    # to compile the other two backends XevIo speaks. macOS ships on kqueue,
    # and a kqueue-only break surfaced at the next release tag. epoll,
    # build.zig's readiness model on Linux, stopped compiling on 2026-08-27
    # and nothing noticed for three months.
    #
    # Both compile here, from Linux. Zig cross-compiles to Darwin, and
    # libcrypto is built by Zig for the target, as release.yml's
    # x86_64-macos leg already relies on. Compile only: running kqueue
    # takes a Mac, which release.yml's macOS legs are. epoll's run waits on
    # libxev's epoll cancel, which acts only on an op not yet started and
    # panics doing it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Cross-compile for macOS (kqueue)
        run: |
          zig build -Dtarget=aarch64-macos --prefix out/aarch64-macos --summary all
          zig build -Dtarget=x86_64-macos --prefix out/x86_64-macos --summary all

      - name: Build the epoll backend
        run: zig build -Dio-backend=epoll --prefix out/epoll --summary all

  conformance:
    name: conformance (h2spec, h3spec)
    # Independent RFC 9113 and RFC 9114/9204 suites, against the shipped
    # ReleaseSafe build on io_uring, their failures held equal to what
    # DESIGN.md §12 records (§9). Outside `zig build ci` because each is an
    # external binary. Here each is its suite's own release, checked
    # against a digest pinned in this file. GitHub publishes h3spec's
    # digest; h2spec's 2020 release predates asset digests, so its pin is
    # the binary the tarball unpacks to.
    #
    # x86_64 only, because neither suite ships a Linux ARM build. h2spec's
    # release is built with Go 1.12, which offers TLS 1.3 only under
    # GODEBUG=tls13=1. The harness sets that for it.
    runs-on: ubuntu-latest
    env:
      H2SPEC_URL: https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
      H2SPEC_SHA256: ac679b916bcd46c52314b17c8903d8dffebf0f2357586d272731f6d8bfd5e9f7
      H3SPEC_URL: https://github.com/kazu-yamamoto/h3spec/releases/download/v0.1.15/h3spec-linux-x86_64
      H3SPEC_SHA256: c3c5f497153f4ba81f82023791ba7f9a4bc46d4141211e614196f141c5996830
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install h2spec and h3spec
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/conformance"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/h2spec.tar.gz" "$H2SPEC_URL"
          tar xzf "$RUNNER_TEMP/h2spec.tar.gz" -C "$bin" h2spec
          echo "$H2SPEC_SHA256  $bin/h2spec" | sha256sum -c -
          curl -fsSL --retry 3 -o "$bin/h3spec" "$H3SPEC_URL"
          echo "$H3SPEC_SHA256  $bin/h3spec" | sha256sum -c -
          chmod +x "$bin/h2spec" "$bin/h3spec"
          echo "$bin" >> "$GITHUB_PATH"

      - name: h2spec (RFC 9113, over h2c and TLS)
        run: zig build h2spec --summary all

      - name: h3spec (RFC 9114 and 9204, over QUIC)
        run: zig build h3spec --summary all

      # On failure, the harnesses' own reports: which cases, and what the
      # proxy logged.
      - name: Upload the conformance reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-reports
          path: |
            .zig-cache/zoxy-h2spec/
            .zig-cache/zoxy-h3spec/
          if-no-files-found: ignore

  coverage:
    name: coverage
    # kcov is Linux-only; the merged report is the unit tests plus a
    # simulator sweep, which reaches error paths unit tests cannot.
    #
    # Pinned to 26.04 rather than ubuntu-latest because that is where kcov
    # comes from: Ubuntu's archive carries kcov 43 from 26.04 on (24.04 has
    # none at all), the same release nixpkgs gives the dev shell, so
    # build.zig's workaround for kcov 43's DWARF gotcha holds for both. A
    # moving label would make the kcov version move under it.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      # From the runner's own Ubuntu mirror rather than a third-party
      # download, with apt's retries on for a transient mirror failure.
      - name: Install kcov
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y kcov
          kcov --version

      - name: Measure coverage (kcov)
        run: zig build coverage

      # What only the unit tests reach (DESIGN.md §9): the whole report in
      # this log, its totals and per-file table in the job summary.
      - name: Report the sim gap
        run: |
          cat zig-out/coverage/sim-gap.txt
          {
            echo '```'
            awk '/^== the serving-path gap/ { exit } { print }' zig-out/coverage/sim-gap.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: zig-out/coverage/kcov-merged/cobertura.xml
          format: cobertura
