name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# or run manually from the Actions tab, supplying the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
      dry_run:
        description: 'Build and package only — publish nothing, touch no tap'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # One runner per target, natively.
  #
  # These used to cross-compile from a single Linux runner, which stopped
  # working the moment zoxy gained a C dependency: `linkSystemLibrary("crypto")`
  # resolves libcrypto out of the *host's* nix store, so every target but the
  # host's own architecture fails to link ("libcrypto.so is incompatible with
  # aarch64linux"). It failed on the 0.2.0 tag, after TLS termination (#125)
  # made libcrypto load-bearing, and it took the release from four platforms to
  # one — including both macOS targets, whose SIGTERM hang (#203) was the very
  # thing that release existed to fix.
  #
  # Building natively also means every artifact is produced on the platform it
  # runs on, which is the only way the release checklist's "smoke the actual
  # artifact" step can ever stop being manual.
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-linux
            os: ubuntu-latest
            zig_target: x86_64-linux-musl
            # x86_64 gets v3 (AVX2/BMI2/FMA, Haswell 2013+ / Zen 2017+): the
            # default baseline is plain SSE2, which caps hparse's vector width
            # at 128 bits (std.simd.suggestVectorLength keys off target CPU
            # features, DESIGN.md §7); v3 doubles it to 256.
            cpu: x86_64_v3
            static: true
          - label: aarch64-linux
            os: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
            # aarch64 keeps its default baseline — NEON is mandatory in
            # ARMv8-A, so there is no wider portable win to take.
            cpu: ''
            static: true
          # x86_64-macos is deliberately absent as of 0.2.0. Building it
          # natively needs an Intel macOS runner, and GitHub's `macos-13`
          # is retired: the 0.2.0 attempt sat queued for seven hours and
          # never started. That is the worse failure mode — a wrong runner
          # label does not fail, it *hangs*, so it blocks every other leg
          # rather than reporting. Cross-compiling it from Apple Silicon
          # is what this whole file just stopped doing, and for the same
          # reason: libcrypto would come from the wrong architecture.
          #
          # Intel Macs can build from source until an Intel runner exists
          # again. Revisit if GitHub ships a supported label.
          - label: aarch64-macos
            os: macos-latest
            zig_target: aarch64-macos
            cpu: ''
            # Darwin has no static libc, so a macOS binary cannot be fully
            # static and must not ask to be. libcrypto still comes from the
            # archive pkg-config names — what stays dynamic is libSystem,
            # which every macOS machine has. The nix-store check below is
            # what holds that distinction to its promise.
            static: false
    runs-on: ${{ matrix.os }}
    steps:
      # A dispatch defaults to the branch it was launched from, which would
      # build one commit and then label it — and smoke-test it — as another's
      # version. Build the tag that is being released.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes

      - name: Set up devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/v2.1.2

      - name: Resolve version
        id: ver
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # libcrypto has to come from a *static*, target-ABI build, and the
      # only lever that reaches every consumer is pkg-config: zig resolves
      # `-lcrypto` through it, and so does ztls's own build.zig, which is
      # a pinned dependency this repo cannot reach into. Point pkg-config
      # at a static openssl and both link the archive; point it anywhere
      # else and the release links a shared library that is not on the
      # machines it ships to.
      - name: Resolve a static libcrypto
        id: crypto
        run: |
          set -euo pipefail
          dev="$(nix build --no-link --print-out-paths 'nixpkgs#pkgsStatic.openssl^dev')"
          echo "pkg_config_path=$dev/lib/pkgconfig" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          # -Dbuild-id is passed rather than left to build.zig's `git
          # describe` fallback: this checkout is shallow and carries no
          # tags, so describe would fall back to a bare commit SHA and
          # stamp every release binary with one. Handing it the tag makes
          # the identifier equal the version, which `zoxy --version`
          # recognises and omits — a release says `zoxy 0.0.7` and
          # nothing else, whatever the checkout depth happens to be.
          # `env` *inside* the devenv shell, not on the step. `devenv
          # shell` establishes its own environment and replaces
          # PKG_CONFIG_PATH with one naming the shell's dynamic openssl,
          # so a value exported outside is silently discarded — the build
          # then links the shared library and the artifact fails to start.
          # That is precisely how the first static-linking attempt
          # regressed: it was verified by invoking zig directly, where
          # there is no shell to overwrite anything.
          devenv shell -- env PKG_CONFIG_PATH="${{ steps.crypto.outputs.pkg_config_path }}" \
            zig build \
            -Dtarget="${{ matrix.zig_target }}" \
            ${{ matrix.cpu && format('-Dcpu={0}', matrix.cpu) || '' }} \
            ${{ matrix.static && '-Dstatic' || '' }} \
            -Doptimize=ReleaseSafe \
            -Dbuild-id="${{ steps.ver.outputs.tag }}" --prefix out

          # Nothing from the build machine may follow the binary out.
          #
          # This is the check the 0.2.0 tag needed and did not have. TLS
          # termination gave zoxy a C dependency, `linkSystemLibrary`
          # links it shared, and the Linux artifact silently became one
          # that wants a musl loader and a musl-ABI libcrypto.so.3 at
          # runtime — unrunnable on a stock box, and indistinguishable
          # from a good build until someone tried to start it.
          #
          # A nix store path baked into a release is the same failure
          # wearing macOS clothes, so both are refused here rather than
          # discovered by whoever downloads it.
          case "${{ runner.os }}" in
            Linux)
              if readelf -d ./out/bin/zoxy 2>/dev/null | grep -q NEEDED; then
                echo "::error::not static:"; readelf -d ./out/bin/zoxy | grep NEEDED
                exit 1
              fi
              ;;
            macOS)
              if otool -L ./out/bin/zoxy | grep -q /nix/store; then
                echo "::error::links the build machine's nix store:"
                otool -L ./out/bin/zoxy | grep /nix/store
                exit 1
              fi
              ;;
          esac

          # And it runs, on the platform it was built for, and says it is
          # the version being released. A release that reports the wrong
          # version is the failure the bump-before-tag rule exists to
          # prevent; this is where it shows.
          reported="$(./out/bin/zoxy --version)"
          echo "built: $reported"
          case "$reported" in
            *"$version"*) ;;
            *) echo "::error::binary reports '$reported', expected $version"; exit 1 ;;
          esac

          tar czf "dist/zoxy-$version-${{ matrix.label }}.tar.gz" -C out/bin zoxy

      - uses: actions/upload-artifact@v4
        with:
          name: zoxy-${{ matrix.label }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A dispatch defaults to the branch it was launched from, which would
      # build one commit and then label it — and smoke-test it — as another's
      # version. Build the tag that is being released.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes

      - name: Set up devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/v2.1.2

      - name: Resolve version
        id: ver
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          # On `push` there are no inputs at all, so this is empty and the
          # release is real. Only an explicit dispatch can ask for a rehearsal.
          #
          # The steps below gate on `dry == 'false'` rather than `!= 'true'`,
          # so this going missing blocks a release instead of publishing one
          # that was asked to be a rehearsal: a release that did not happen is
          # a re-run away, one that did cannot be unpublished.
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run — building $ref, publishing nothing"
          else
            echo "dry=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect artifacts and checksum
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          find staging -name '*.tar.gz' -exec mv {} dist/ \;

          # Every platform or none. A partial release is how a four-target
          # matrix quietly becomes a one-target one — which is exactly what
          # the cross-compile it replaced did on the 0.2.0 tag, and the
          # `fail-fast: false` above means a single broken target no longer
          # cancels the others into looking like they were never tried.
          for label in x86_64-linux aarch64-linux aarch64-macos; do
            test -f "dist/zoxy-$version-$label.tar.gz" \
              || { echo "::error::missing artifact for $label"; exit 1; }
          done

          # The config JSON Schema is target-independent, so emit it once
          # (§5). It is generated from the Zig config definitions, never
          # committed; shipping it here as an asset keeps a single source of
          # truth.
          devenv shell -- zig build schema
          cp zig-out/config.schema.json "dist/zoxy-$version-config.schema.json"

          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -la dist

      - name: Publish GitHub Release
        if: steps.ver.outputs.dry == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      # A guard that fails closed can fail *silently*: if `dry` were ever
      # anything but the 'false' those two steps test for, a real release would
      # skip both and still report success — a green run that shipped nothing.
      # So check the outcome rather than trusting the condition.
      #
      # Deliberately `!= 'true'`: erring towards running a check is the safe
      # direction, the opposite of erring towards publishing.
      - name: Verify the release was published
        if: steps.ver.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          gh release view "$tag" --json assets --jq '.assets[].name' | tee assets.txt
          for label in x86_64-linux aarch64-linux aarch64-macos; do
            grep -qx "zoxy-$version-$label.tar.gz" assets.txt \
              || { echo "::error::$tag is missing the $label archive"; exit 1; }
          done
          grep -qx 'SHA256SUMS.txt' assets.txt \
            || { echo "::error::$tag has no SHA256SUMS.txt"; exit 1; }
          grep -qx "zoxy-$version-config.schema.json" assets.txt \
            || { echo "::error::$tag has no config schema"; exit 1; }
          echo "$tag published complete"

      - name: Update Homebrew formula
        if: steps.ver.outputs.dry == 'false'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"

          sha_aarch64_macos=$(grep "zoxy-$version-aarch64-macos.tar.gz" dist/SHA256SUMS.txt | awk '{print $1}')
          sha_aarch64_linux=$(grep "zoxy-$version-aarch64-linux.tar.gz" dist/SHA256SUMS.txt | awk '{print $1}')
          sha_x86_64_linux=$(grep  "zoxy-$version-x86_64-linux.tar.gz"  dist/SHA256SUMS.txt | awk '{print $1}')

          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          git clone git@github.com:zoxy-io/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/zoxy.rb << FORMULA
          class Zoxy < Formula
            desc "Zero-allocation L4/L7 edge proxy in Zig"
            homepage "https://zoxy.io/"
            license "MIT"

            livecheck do
              url "https://github.com/zoxy-io/zoxy"
              strategy :github_latest
            end

            # Apple Silicon only. There is no Intel macOS bottle from
            # 0.2.0 on: building one needs an Intel macOS runner, and
            # GitHub's is retired. Homebrew on an Intel Mac will report
            # that no bottle is available rather than download one that
            # cannot run, which is the failure worth having.
            on_macos do
              on_arm do
                url "https://github.com/zoxy-io/zoxy/releases/download/$tag/zoxy-$version-aarch64-macos.tar.gz"
                sha256 "$sha_aarch64_macos"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/zoxy-io/zoxy/releases/download/$tag/zoxy-$version-aarch64-linux.tar.gz"
                sha256 "$sha_aarch64_linux"
              end
              on_intel do
                url "https://github.com/zoxy-io/zoxy/releases/download/$tag/zoxy-$version-x86_64-linux.tar.gz"
                sha256 "$sha_x86_64_linux"
              end
            end

            def install
              bin.install "zoxy"
            end

            test do
              output = shell_output("#{bin}/zoxy #{testpath}/missing.json 2>&1", 1)
              assert_match "cannot read config", output
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "zoxy: update to $version"
          git push

      # zoxy.io's /config page is generated from this release: the config JSON
      # Schema asset published above, config/example.json at this tag, and the
      # tarball sizes. Tell the site to pull them — it documents the zoxy people
      # can install, so a release is the only event that changes the page.
      # SITE_DISPATCH_TOKEN is a fine-grained PAT with contents:write on
      # zoxy-io/site (its refresh-config.yml commits the refreshed files).
      #
      # Last step on purpose: the release and the tap are already published by
      # the time it runs, so a rejected token fails loudly here without holding
      # either of them up. Left strict rather than continue-on-error for that
      # reason — a red step is how an expired token gets noticed, and the site's
      # weekly refresh catches the page up in the meantime.
      - name: Notify zoxy-io/site
        if: steps.ver.outputs.dry == 'false'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # the body goes in as JSON rather than as -f/-F fields: client_payload
          # is a nested object, and this leaves no question about how the key is
          # parsed or the tag typed
          jq -n --arg tag "$TAG" \
            '{event_type: "zoxy-release", client_payload: {tag: $tag}}' |
            gh api repos/zoxy-io/site/dispatches --input -

      - name: Dry run summary
        if: steps.ver.outputs.dry == 'true'
        run: |
          {
            echo "### Dry run — nothing was published"
            echo
            echo "Built \`${{ steps.ver.outputs.tag }}\`, smoke-tested each binary on"
            echo "its own platform, packaged everything, and stopped before the"
            echo "release and the tap."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
